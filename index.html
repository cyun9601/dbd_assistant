<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DBD 퍽 검색기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔪</text></svg>" />
<style>
  :root {
    --bg: #0c0c0f; --panel: #16161c; --panel2: #1e1e26;
    --line: #2a2a35; --text: #e9e9ef; --muted: #9a9aa8;
    --accent: #c0392b; --accent2: #e67e22; --good: #2ecc71;
    --surv: #2980b9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(12,12,15,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); padding: 14px 16px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 10px; letter-spacing: .5px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .searchrow { display: flex; gap: 8px; align-items: stretch; }
  #q {
    flex: 1; background: var(--panel2); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 16px;
    outline: none;
  }
  #q:focus { border-color: var(--accent2); }
  #clear {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 10px; padding: 0 14px; cursor: pointer; font-size: 18px;
  }
  .modes { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .mode-btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 13px;
  }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .roles { display: flex; gap: 8px; margin-top: 10px; }
  .role-btn {
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600;
  }
  .role-btn[data-role="killer"].active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .role-btn[data-role="survivor"].active { background: var(--surv); border-color: var(--surv); color: #fff; }
  .fav-toggle {
    margin-left: auto; background: var(--panel2); border: 1px solid var(--line);
    color: var(--muted); padding: 8px 16px; border-radius: 999px; cursor: pointer;
    font-size: 14px; font-weight: 600;
  }
  .fav-toggle.active { background: #3a3000; border-color: #f1c40f; color: #f1c40f; }
  .fav-toggle .fav-count { opacity: .85; font-size: 12px; margin-left: 2px; }
  .card .owner.surv { color: #7fb8e0; }
  #model { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  .reason { margin-top: 6px; font-size: 12.5px; color: #8fd6a6;
    border-left: 2px solid #2e7d4f; padding-left: 8px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #status { font-size: 12px; color: var(--accent2); margin-top: 8px; min-height: 16px; }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  .examples { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    padding: 5px 10px; border-radius: 999px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }
  .count { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .card {
    display: flex; gap: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 10px;
  }
  .card .ic { width: 64px; height: 64px; flex: 0 0 64px; }
  .card .ic img { width: 100%; height: 100%; object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .card .body { flex: 1; min-width: 0; }
  .card .top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .card .name { font-size: 16px; font-weight: 700; }
  .card .owner { font-size: 12px; color: var(--muted); }
  .card .star {
    margin-left: auto; background: none; border: none; cursor: pointer;
    font-size: 19px; line-height: 1; color: #555; padding: 0 2px;
    transition: color .12s, transform .12s;
  }
  .card .star:hover { transform: scale(1.15); color: #f1c40f; }
  .card .star.on { color: #f1c40f; }
  .card .score { font-size: 11px; color: var(--good);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
  /* 태그 */
  .card .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; align-items: center; }
  .tag {
    display: inline-flex; align-items: center; gap: 1px; font-family: inherit;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 2px 4px 2px 9px; font-size: 11.5px; line-height: 1.5;
  }
  .tag .tag-label { cursor: pointer; }
  .tag:hover { border-color: var(--accent2); color: var(--text); }
  .tag.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .tag .tag-x { background: none; border: none; color: inherit; cursor: pointer;
    font-size: 13px; opacity: .4; padding: 0 3px; line-height: 1; }
  .tag .tag-x:hover { opacity: 1; color: #ff6b5b; }
  .tag-add, .tag-reset {
    background: none; border: 1px dashed var(--line); color: var(--muted);
    border-radius: 999px; cursor: pointer; font-size: 12px; padding: 1px 9px; line-height: 1.6;
  }
  .tag-add:hover, .tag-reset:hover { border-color: var(--accent2); color: var(--text); }
  .tag-input {
    background: var(--panel2); border: 1px solid var(--accent2); color: var(--text);
    border-radius: 999px; padding: 2px 9px; font-size: 11.5px; width: 96px; outline: none;
  }
  /* 헤더의 태그 필터 바 */
  .tagbar { display: none; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .tagbar-label { color: var(--muted); font-size: 12px; }
  .tagbar-clear { background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 3px 11px; font-size: 12px; cursor: pointer; }
  .tagbar-clear:hover { color: var(--text); border-color: var(--accent2); }
  /* 전체 태그 목록 보기 */
  .taglist { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0;
    align-items: center; align-content: flex-start; }
  .taglist-item { cursor: pointer; font-size: 13px; padding: 5px 5px 5px 12px; gap: 5px; }
  .taglist-item .tag-count { background: var(--line); color: var(--muted);
    border-radius: 999px; padding: 0 7px; font-size: 11px; }
  .taglist-item.empty { opacity: .38; cursor: default; }
  .taglist-item.empty:hover { border-color: var(--line); color: var(--muted); }
  .card .desc { margin-top: 7px; font-size: 13.5px; line-height: 1.6; color: #cfcfda; }
  .desc .Highlight1 { color: #f1c40f; font-weight: 700; }
  .desc .Highlight2 { color: #5dade2; font-weight: 700; }
  .desc .Highlight3 { color: #e67e22; font-weight: 700; }
  .desc b { color: #fff; }
  .desc .ReminderText { color: var(--muted); font-style: italic; font-size: 12.5px; }
  .hl { background: #5a3a00; color: #ffd866; border-radius: 3px; padding: 0 1px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { color: #55555f; font-size: 11px; text-align: center; padding: 24px 0; }
  footer a { color: #777; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🔪 DBD 퍽 검색기 <small id="perkcount"></small></h1>
    <div class="roles" id="roles">
      <button class="role-btn active" data-role="killer">🔪 살인마</button>
      <button class="role-btn" data-role="survivor">🩹 생존자</button>
      <button class="fav-toggle" id="favBtn" title="즐겨찾기한 퍽만 보기">⭐ 즐겨찾기 <span class="fav-count" id="favCount">0</span></button>
      <button class="fav-toggle" id="tagListBtn" title="전체 태그 목록 보기">🏷️ 태그</button>
    </div>
    <div class="searchrow">
      <input id="q" type="text" placeholder="퍽 효과를 적어보세요. 예) 살인마 속도가 빨라졌어" autocomplete="off" autofocus />
      <button id="clear" title="지우기">✕</button>
    </div>
    <div class="modes">
      <button class="mode-btn active" data-mode="keyword">키워드 + 유의어</button>
      <button class="mode-btn" data-mode="semantic">의미 기반 AI</button>
      <button class="mode-btn" data-mode="llm">AI 정밀 검색</button>
      <select id="model" title="모델 선택" style="display:none">
        <optgroup label="Anthropic (ANTHROPIC_API_KEY)">
          <option value="claude-opus-4-8">Opus 4.8 (정확)</option>
          <option value="claude-haiku-4-5">Haiku 4.5 (빠름)</option>
        </optgroup>
        <optgroup label="OpenAI (OPENAI_API_KEY)">
          <option value="gpt-4.1">GPT-4.1 (정확)</option>
          <option value="gpt-4.1-mini">GPT-4.1 mini (빠름)</option>
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4o-mini">GPT-4o mini</option>
        </optgroup>
      </select>
      <span class="hint" id="modehint">즉시 · 오프라인</span>
    </div>
    <div id="status"></div>
    <div class="tagbar" id="tagbar"></div>
  </div>
</header>
<datalist id="tagvocab"></datalist>
<main>
  <div class="examples" id="examples"></div>
  <div class="count" id="count"></div>
  <div id="results"></div>
</main>
<footer>
  데이터 출처: dbd-db.com · 살인마 + 생존자 퍽 · 로컬에서 동작
</footer>

<script src="perks_data.js"></script>
<script src="synonyms.js"></script>
<script src="search.js"></script>
<script>
const { rankKeyword, highlightMatches, expandedQueryTerms } = window.DBDSearch;

const PERKS = window.PERKS || [];
const SYN = window.SYNONYMS || [];
const $ = (s) => document.querySelector(s);
const results = $("#results");
const countEl = $("#count");
const statusEl = $("#status");

let mode = "keyword";
let role = "killer";          // 현재 선택된 역할 (살인마/생존자)
let semantic = null;          // lazy-loaded state
let favView = false;          // 즐겨찾기 보기 on/off
let favorites = new Set();    // 즐겨찾기한 퍽 id 집합
let TAGS = [];                // 전체 태그 어휘 (필터/자동완성용)
let PERK_TAGS = {};           // 퍽 id -> 태그 배열 (유효 태그 = 기본+사용자수정 병합)
let OVERRIDDEN = new Set();   // 사용자가 기본값에서 수정한 퍽 id
let tagFilter = new Set();    // 활성 태그 필터 (모두 만족하는 퍽만, AND)
let tagListView = false;      // 전체 태그 목록 보기 on/off

const ROLE_WORD = { killer: "살인마", survivor: "생존자" };
const perksForRole = () => PERKS.filter((p) => p.role === role);

// ---- 즐겨찾기 ----
const FAV_LS_KEY = "dbd-favorites";   // 서버 미사용(file://) 시 폴백 저장소
const isFav = (id) => favorites.has(id);
const favPerksForRole = () => perksForRole().filter((p) => isFav(p.id));

function updateFavCount() {
  $("#favCount").textContent = favPerksForRole().length;
}

// 시작 시 서버에서 즐겨찾기 로드 (서버 없으면 localStorage 폴백)
async function loadFavorites() {
  try {
    const res = await fetch("/favorites");
    if (res.ok) { favorites = new Set((await res.json()).favorites || []); return; }
  } catch { /* 서버 없음 */ }
  try { favorites = new Set(JSON.parse(localStorage.getItem(FAV_LS_KEY) || "[]")); }
  catch { favorites = new Set(); }
}

// 토글 영속화: 서버(favorites.json)에 기록, 실패하면 localStorage
async function persistFavorite(id, on) {
  try {
    const res = await fetch("/favorites", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ id, on }),
    });
    if (res.ok) { favorites = new Set((await res.json()).favorites || []); return; }
    throw new Error("bad");
  } catch {
    try { localStorage.setItem(FAV_LS_KEY, JSON.stringify([...favorites])); } catch {}
  }
}

function exitFavView() {
  if (!favView) return;
  favView = false;
  $("#favBtn").classList.remove("active");
}

// ---- 태그 ----
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tagsOf = (id) => PERK_TAGS[id] || [];
const perkHasAllTags = (id, set) => { const t = new Set(tagsOf(id)); for (const x of set) if (!t.has(x)) return false; return true; };

// 시작 시 서버에서 유효 태그(기본+사용자수정 병합) 로드. 서버 없으면 태그 미표시.
async function loadTags() {
  try {
    const res = await fetch("/tags");
    if (!res.ok) return;
    const d = await res.json();
    TAGS = d.tags || [];
    PERK_TAGS = d.perks || {};
    OVERRIDDEN = new Set(d.overridden || []);
    syncVocab();
  } catch { /* 서버 없음(file://) — 태그 기능 비활성 */ }
}

function syncVocab() {
  const dl = $("#tagvocab");
  if (dl) dl.innerHTML = TAGS.map((t) => `<option value="${esc(t)}">`).join("");
}

// 한 퍽 카드의 태그 줄 내용 (칩들 + 추가 버튼 + 되돌리기)
function tagRowInner(id) {
  const chips = tagsOf(id).map((t) =>
    `<span class="tag${tagFilter.has(t) ? " active" : ""}" data-tag="${esc(t)}">` +
    `<span class="tag-label">#${esc(t)}</span>` +
    `<button class="tag-x" title="이 퍽에서 태그 제거">×</button></span>`).join("");
  const reset = OVERRIDDEN.has(id)
    ? `<button class="tag-reset" title="기본 태그로 되돌리기">↺</button>` : "";
  return chips + `<button class="tag-add" title="태그 추가">＋</button>` + reset;
}

// 서버에 태그 변경 저장 (성공 시 유효값으로 동기화). 서버 없으면 메모리에만.
async function postTags(body) {
  try {
    const res = await fetch("/tags", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    if (res.ok) return await res.json();
  } catch {}
  return null;
}

async function setPerkTags(id, tags) {
  PERK_TAGS[id] = tags;            // 낙관적 반영
  OVERRIDDEN.add(id);
  afterTagEdit(id);
  const r = await postTags({ id, tags });
  if (r) {
    PERK_TAGS[id] = r.tags;
    OVERRIDDEN[r.overridden ? "add" : "delete"](id);
    TAGS = r.vocab || TAGS; syncVocab();
    afterTagEdit(id);
  }
}

async function resetPerkTags(id) {
  const r = await postTags({ id, reset: true });
  if (r) {
    PERK_TAGS[id] = r.tags;
    OVERRIDDEN.delete(id);
    TAGS = r.vocab || TAGS; syncVocab();
  }
  afterTagEdit(id);
}

// 태그 편집 후 화면 갱신: 필터 보기에서 조건을 벗어나면 목록 재구성, 아니면 해당 줄만 다시 그림
function afterTagEdit(id) {
  if (tagFilter.size && !perkHasAllTags(id, tagFilter)) { renderTagFilter(); return; }
  const row = results.querySelector(`.tags[data-perk="${id}"]`);
  if (row) row.innerHTML = tagRowInner(id);
}

function exitTagFilter() {
  if (!tagFilter.size) return;
  tagFilter.clear();
  renderTagBar();
}

function toggleTagFilter(tag) {
  exitFavView(); exitTagList();
  if (tagFilter.has(tag)) tagFilter.delete(tag); else tagFilter.add(tag);
  renderTagBar();
  if (tagFilter.size) renderTagFilter(); else runSearch();
}

function renderTagBar() {
  const bar = $("#tagbar");
  if (!tagFilter.size) { bar.style.display = "none"; bar.innerHTML = ""; return; }
  bar.style.display = "flex";
  bar.innerHTML = `<span class="tagbar-label">🏷️ 태그 필터</span>` +
    [...tagFilter].map((t) =>
      `<span class="tag active" data-tag="${esc(t)}"><span class="tag-label">#${esc(t)}</span>` +
      `<button class="tag-x" title="해제">×</button></span>`).join("") +
    `<button class="tagbar-clear">전체 해제</button>`;
}

// 태그 필터 보기: 현재 역할에서 활성 태그를 모두 가진 퍽 (검색/모드 무관)
function renderTagFilter() {
  const list = perksForRole().filter((p) => perkHasAllTags(p.id, tagFilter))
    .slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
  const label = [...tagFilter].map((t) => `#${t}`).join(" ");
  if (!list.length) {
    countEl.textContent = "";
    results.innerHTML = `<div class="empty">${label} 태그를 가진 ${ROLE_WORD[role]} 퍽이 없어요.</div>`;
    return;
  }
  countEl.textContent = `🏷️ ${label} — ${list.length}개 (${ROLE_WORD[role]})`;
  results.innerHTML = list.map((perk) => cardHtml(perk, { desc: perk.desc_html })).join("");
}

// 태그 추가 입력창 열기 (＋ 자리에 인라인 input)
function openTagAdd(row, id) {
  if (row.querySelector(".tag-input")) return;
  const input = document.createElement("input");
  input.className = "tag-input"; input.placeholder = "태그 추가"; input.setAttribute("list", "tagvocab");
  row.insertBefore(input, row.querySelector(".tag-add"));
  input.focus();
  let done = false;
  const cleanup = () => { input.removeEventListener("keydown", onKey); input.removeEventListener("blur", onBlur); if (input.parentNode) input.remove(); };
  const commit = () => { if (done) return; done = true; const v = input.value.trim(); cleanup(); if (v && !tagsOf(id).includes(v)) setPerkTags(id, [...tagsOf(id), v]); };
  const onKey = (e) => { if (e.key === "Enter") { e.preventDefault(); commit(); } else if (e.key === "Escape") { done = true; cleanup(); } };
  const onBlur = () => commit();
  input.addEventListener("keydown", onKey);
  input.addEventListener("blur", onBlur);
}

// 카드 영역의 태그 상호작용 (이벤트 위임)
results.addEventListener("click", (e) => {
  const row = e.target.closest(".tags");
  if (!row) return;
  const id = row.dataset.perk;
  if (e.target.closest(".tag-x")) { setPerkTags(id, tagsOf(id).filter((t) => t !== e.target.closest(".tag").dataset.tag)); return; }
  if (e.target.closest(".tag-reset")) { resetPerkTags(id); return; }
  if (e.target.closest(".tag-add")) { openTagAdd(row, id); return; }
  const label = e.target.closest(".tag-label");
  if (label) { toggleTagFilter(e.target.closest(".tag").dataset.tag); }
});

// 헤더 태그 필터 바 상호작용
$("#tagbar").addEventListener("click", (e) => {
  if (e.target.closest(".tagbar-clear")) { exitTagFilter(); runSearch(); return; }
  const x = e.target.closest(".tag-x");
  if (x) {
    tagFilter.delete(e.target.closest(".tag").dataset.tag);
    renderTagBar();
    if (tagFilter.size) renderTagFilter(); else runSearch();
  }
});

// ---- 전체 태그 목록 보기 ----
function exitTagList() {
  if (!tagListView) return;
  tagListView = false;
  $("#tagListBtn").classList.remove("active");
}

// 현재 역할 기준으로 각 태그가 달린 퍽 수를 세어, 많은 순으로 칩을 보여준다.
function renderTagList() {
  const pool = perksForRole();
  const items = TAGS.map((t) => ({ tag: t, n: pool.filter((p) => tagsOf(p.id).includes(t)).length }))
    .sort((a, b) => b.n - a.n || a.tag.localeCompare(b.tag, "ko"));
  countEl.textContent = `🏷️ 전체 태그 ${TAGS.length}종 · 클릭하면 해당 태그로 필터 (${ROLE_WORD[role]} 기준)`;
  if (!TAGS.length) {
    results.innerHTML = `<div class="empty">태그 데이터를 불러오지 못했어요. run.bat 으로 서버를 실행했는지 확인하세요.</div>`;
    return;
  }
  results.innerHTML = `<div class="taglist">` + items.map(({ tag, n }) =>
    `<button class="tag taglist-item${n ? "" : " empty"}" data-tag="${esc(tag)}"${n ? "" : " disabled"}>` +
    `<span class="tag-label">#${esc(tag)}</span><span class="tag-count">${n}</span></button>`).join("") +
    `</div>`;
}

$("#tagListBtn").onclick = () => {
  tagListView = !tagListView;
  $("#tagListBtn").classList.toggle("active", tagListView);
  if (tagListView) { exitFavView(); exitTagFilter(); renderTagList(); }
  else runSearch();
};

// 태그 목록에서 태그 클릭 → 해당 태그 필터로 전환

  if (tagListView) renderTagList();
  else if (tagFilter.size) renderTagFilter();
  else if (favView) renderFavorites();
  else runSearch();
}

    "비명 지르면 위치 들킴",

    "판자에 맞고 경직이 길어졌어",
  ],
  survivor: [

    "치료 속도 빨라지는 퍽",

// 예시 칩 (역할에 맞춰 다시 그림)

  $("#perkcount").textContent = `(${ROLE_WORD[role]} ${perksForRole().length}개)`;
  $("#q").placeholder = PLACEHOLDER[role];

applyRole();

// 모드 전환
const HINTS = {
  keyword: "즉시 · 오프라인",
  semantic: "AI 임베딩 · 첫 사용 시 모델 다운로드",
  llm: "LLM 정밀 매칭 · 로컬 서버 + API 키 필요",
};
document.querySelectorAll(".mode-btn").forEach((b) => {
  b.onclick = async () => {
    exitFavView(); exitTagFilter(); exitTagList();
    document.querySelectorAll(".mode-btn").forEach((x) => x.classList.remove("active"));

document.querySelectorAll(".role-btn").forEach((b) => {

// 즐겨찾기 보기 토글
$("#favBtn").onclick = () => {
  favView = !favView;
  $("#favBtn").classList.toggle("active", favView);
  if (favView) { exitTagFilter(); exitTagList(); renderFavorites(); }
  else runSearch();
};

$("#clear").onclick = () => { $("#q").value = ""; exitFavView(); exitTagFilter(); exitTagList(); runSearch(); $("#q").focus(); };

let timer = null;
$("#q").addEventListener("input", () => {
  exitFavView(); exitTagFilter(); exitTagList();   // 검색을 시작하면 즐겨찾기/태그 보기 해제
  if (mode === "llm") return; // LLM 모드는 매 타이핑마다 호출하지 않음 (Enter로 실행)
  clearTimeout(timer);
  timer = setTimeout(runSearch, mode === "keyword" ? 80 : 250);

// 퍽 카드 1개의 HTML. 별표(즐겨찾기) 토글 포함.
function cardHtml(perk, { badge = "", reason = "", desc } = {}) {
  const fav = isFav(perk.id);
  const reasonHtml = reason ? `<div class="reason">💡 ${reason}</div>` : "";
  const badgeHtml = badge ? `<span class="score">${badge}</span>` : "";
  return `<div class="card">
    <div class="ic"><img src="${perk.icon_file}" alt="" loading="lazy"></div>
    <div class="body">
      <div class="top">
        <span class="name">${perk.name}</span>
        <span class="owner${perk.role === 'survivor' ? ' surv' : ''}">${perk.owner === 'public' ? '공용' : perk.owner}</span>
        <button class="star${fav ? ' on' : ''}" data-fav-id="${perk.id}" title="즐겨찾기" aria-pressed="${fav}">${fav ? '★' : '☆'}</button>
        ${badgeHtml}
      </div>
      ${reasonHtml}
      <div class="desc">${desc != null ? desc : perk.desc_html}</div>
      <div class="tags" data-perk="${perk.id}">${tagRowInner(perk.id)}</div>
    </div>
  </div>`;
}

function render(list, q) {
  if (!q.trim()) {
    countEl.textContent = "";
    const tip = mode === "llm" ? `퍽 효과를 적고 Enter — LLM이 ${ROLE_WORD[role]} 퍽 전체와 대조해 찾아줍니다.` :
      `위에 퍽 효과를 적으면 가장 비슷한 ${ROLE_WORD[role]} 퍽을 찾아드려요.`;
    results.innerHTML = `<div class="empty">${tip}</div>`;
    return;
  }
  if (!list.length) {
    countEl.textContent = "";
    results.innerHTML = `<div class="empty">일치하는 퍽을 못 찾았어요. 다른 표현으로 바꿔보세요.</div>`;
    return;
  }
  const terms = mode === "keyword" ? expandedQueryTerms(q, SYN) : [];
  countEl.textContent = `${list.length}개 결과 (가능성 높은 순)`;
  results.innerHTML = list.map(({ perk, score, pct, confidence, reason }) => {
    const desc = mode === "keyword" ? highlightMatches(perk.desc_html, terms) : perk.desc_html;
    let badge = "";
    if (mode === "semantic") badge = `${Math.round(pct)}%`;
    else if (mode === "llm") badge = `${confidence}%`;
    else badge = `${score.toFixed(0)}점`;
    return cardHtml(perk, { badge, reason, desc });
  }).join("");
}

// 즐겨찾기 보기: 현재 역할의 즐겨찾기 퍽을 이름순으로 (검색/모드 무관)
function renderFavorites() {
  const list = favPerksForRole().slice().sort((a, b) => a.name.localeCompare(b.name, "ko"));
  if (!list.length) {
    countEl.textContent = "";
    results.innerHTML = `<div class="empty">아직 즐겨찾기한 ${ROLE_WORD[role]} 퍽이 없어요.<br>카드 오른쪽의 ☆ 를 눌러 추가하세요.</div>`;
    return;
  }
  countEl.textContent = `⭐ 즐겨찾기 ${list.length}개 (${ROLE_WORD[role]})`;
  results.innerHTML = list.map((perk) => cardHtml(perk, { desc: perk.desc_html })).join("");
}

// 별표 클릭(이벤트 위임) — 카드는 매번 새로 그려지므로 컨테이너에 한 번만 바인딩
results.addEventListener("click", (e) => {
  const btn = e.target.closest(".star");
  if (!btn) return;
  const id = btn.dataset.favId;
  const on = !favorites.has(id);
  if (on) favorites.add(id); else favorites.delete(id);
  btn.classList.toggle("on", on);
  btn.textContent = on ? "★" : "☆";
  btn.setAttribute("aria-pressed", String(on));
  updateFavCount();
  persistFavorite(id, on);
  if (favView && !on) renderFavorites();   // 즐겨찾기 보기 중 해제하면 목록에서 사라지게
});

async function runSearch() {
  const q = $("#q").value;
  if (mode === "keyword") {
    render(rankKeyword(q, perksForRole(), SYN), q);
  } else if (mode === "semantic") {
    if (!q.trim()) { render([], q); return; }
    if (!semantic || !semantic.ready) { await ensureSemantic(); }
    const ranked = await semantic.rank(q);
    render(ranked, q);
  } else if (mode === "llm") {
    if (!q.trim()) { render([], q); return; }
    await runLLM(q);
  }
}

// ---- AI 정밀 검색 (로컬 프록시 /ask) ----
async function runLLM(q) {
  const model = $("#model").value;
  statusEl.textContent = `AI가 ${ROLE_WORD[role]} 퍽 전체와 대조 중…`;
  results.innerHTML = `<div class="empty">분석 중…</div>`;
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ query: q, model, role }),
    });
    const data = await res.json();
    if (!res.ok) {
      statusEl.textContent = data.error || "오류가 발생했습니다.";
      results.innerHTML = `<div class="empty">${data.error || "오류"}</div>`;
      return;
    }
    const list = data.results.map((r) => ({ perk: r.perk, confidence: r.confidence, reason: r.reason }));
    const u = data.usage || {};
    const cached = u.cache_read ? ` · 캐시 ${u.cache_read}토큰` : "";
    statusEl.textContent = `${ALLOWED_MODEL_NAMES[data.model] || data.model} 응답 완료 (입력 ${(u.input||0)+(u.cache_read||0)+(u.cache_write||0)}토큰${cached}, 출력 ${u.output||0}토큰)`;
    render(list, q);
  } catch (e) {
    statusEl.textContent = "서버에 연결할 수 없습니다. run.bat 으로 실행했는지 확인하세요. (file:// 로 열면 이 모드는 동작하지 않습니다)";
    results.innerHTML = `<div class="empty">로컬 서버가 필요합니다. run.bat 으로 실행하세요.</div>`;
  }
}
const ALLOWED_MODEL_NAMES = {
  "claude-opus-4-8": "Opus 4.8", "claude-haiku-4-5": "Haiku 4.5",
  "gpt-4.1": "GPT-4.1", "gpt-4.1-mini": "GPT-4.1 mini", "gpt-4o": "GPT-4o", "gpt-4o-mini": "GPT-4o mini",
};

// ---- 의미 기반 (transformers.js) — 라이브러리/모델 모두 로컬에서 로드 (외부 다운로드 없음) ----
const MODEL = "Xenova/multilingual-e5-small";
const LIB = "/vendor/transformers/transformers.min.js";  // 로컬 라이브러리 (브라우저 ESM 빌드)

function cosine(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; }

async function ensureSemantic() {
  if (semantic && semantic.ready) return;
  if (semantic && semantic.loadingPromise) return semantic.loadingPromise;
  semantic = { ready: false };
  statusEl.textContent = "AI 모델 준비 중…";
  semantic.loadingPromise = (async () => {
    try {
      await ensureModelDownloaded();   // 모델/라이브러리 없으면 서버가 1회 자동 다운로드
      const { pipeline, env } = await import(LIB);
      // 전부 로컬에서 — HuggingFace/CDN 으로 나가지 않음
      env.allowRemoteModels = false;
      env.allowLocalModels = true;
      env.localModelPath = "/models/";
      env.backends.onnx.wasm.wasmPaths = "/vendor/transformers/";
      env.backends.onnx.wasm.numThreads = 1;
      const extractor = await pipeline("feature-extraction", MODEL, {
        dtype: "q8",  // models/.../onnx/model_quantized.onnx 사용
      });
      const embed = async (texts) => {
        const out = await extractor(texts, { pooling: "mean", normalize: true });
        return out.tolist();
      };
      // 코퍼스 임베딩 (캐시)
      statusEl.textContent = "퍽 설명 분석 중…";
      let matrix = await loadCache(PERKS.length);
      if (!matrix) {
        const passages = PERKS.map((p) => `passage: ${p.name}. ${p.desc_text}`);
        matrix = [];
        const B = 16;
        for (let i = 0; i < passages.length; i += B) {
          matrix.push(...await embed(passages.slice(i, i + B)));
          statusEl.textContent = `퍽 설명 분석 중… ${Math.min(i + B, passages.length)}/${passages.length}`;
        }
        saveCache(PERKS.length, matrix);
      }
      semantic.matrix = matrix;
      semantic.rank = async (q) => {
        const [qv] = await embed([`query: ${q}`]);
        // 코퍼스는 전체(306개)를 임베딩해 두고, 순위 산출 시 현재 역할만 추린다
        const scored = [];
        PERKS.forEach((perk, i) => {
          if (perk.role === role) scored.push({ perk, score: cosine(qv, matrix[i]) });
        });
        scored.sort((a, b) => b.score - a.score);
        const top = scored.slice(0, 30);
        // e5 유사도는 좁은 구간(~0.8대)에 몰리므로, 결과 내 상대 신뢰도로 재조정해 순위 차이를 보이게 한다
        const hi = top[0].score, lo = top[top.length - 1].score, span = hi - lo || 1;
        top.forEach((x) => { x.pct = 55 + (x.score - lo) / span * 44; });
        return top;
      };
      semantic.ready = true;
      statusEl.textContent = "AI 검색 준비 완료 ✓";
      setTimeout(() => { if (mode === "semantic") statusEl.textContent = ""; }, 2500);
    } catch (e) {
      console.error(e);
      statusEl.textContent = (e && e.message === "no-server")
        ? "로컬 서버가 필요합니다. run.bat 으로 실행하세요. (file:// 로 열면 의미기반 모드는 동작하지 않습니다)"
        : "AI 모델 준비 실패: " + (e && e.message ? e.message : e);
      semantic = null;
    }
  })();
  return semantic.loadingPromise;
}

// 모델/라이브러리가 없으면 로컬 서버에 1회 다운로드를 요청하고 진행률을 보여준다.
async function ensureModelDownloaded() {
  let st;
  try {
    st = await (await fetch("/model_status")).json();
  } catch {
    throw new Error("no-server");   // file:// 이거나 서버 미실행
  }
  if (st.ready) return;
  statusEl.textContent = "AI 모델 다운로드 중… (처음 1회만, ~155MB)";
  await fetch("/ensure_model", { method: "POST" });
  while (true) {
    await new Promise((r) => setTimeout(r, 800));
    st = await (await fetch("/model_status")).json();
    if (st.error) throw new Error(st.error);
    if (st.ready) return;
    const prog = st.count ? `(${st.index}/${st.count}) ${st.file || ""} ${st.pct}%` : "준비 중…";
    statusEl.textContent = `AI 모델 다운로드 중… ${prog}  (처음 1회만)`;
  }
}

// IndexedDB 임베딩 캐시 (재방문 시 즉시 로드)
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open("dbd-perks", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("emb");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function loadCache(n) {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const tx = db.transaction("emb").objectStore("emb").get(MODEL + ":" + n);
      tx.onsuccess = () => res(tx.result || null); tx.onerror = () => res(null);
    });
  } catch { return null; }
}
async function saveCache(n, matrix) {
  try {
    const db = await idb();
    db.transaction("emb", "readwrite").objectStore("emb").put(matrix, MODEL + ":" + n);
  } catch {}
}

render([], "");
// 즐겨찾기·태그 로드(비동기) 후 화면 갱신 (결과가 있으면 태그 칩이 보이도록 다시 그림)
Promise.all([loadFavorites(), loadTags()]).then(() => {
  updateFavCount();
  refresh();
});
